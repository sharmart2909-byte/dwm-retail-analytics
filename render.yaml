services:
  # Python FastAPI Service
  - type: web
    name: retail-dw-python
    env: python
    region: oregon
    plan: free
    rootDir: python-service
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true

  # Spring Boot Java Backend Service
  - type: web
    name: retail-dw-backend
    env: docker
    region: oregon
    plan: free
    dockerContext: ./backend
    dockerfilePath: ./backend/Dockerfile
    healthCheckPath: /api/auth/me
    autoDeploy: true
    envVars:
      - key: PYTHON_SERVICE_URL
        value: https://retail-dw-python.onrender.com
      - key: SPRING_DATASOURCE_URL
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false

  # React Frontend (Static Site)
  - type: web
    name: retail-dw-frontend
    env: static
    plan: free
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        value: https://retail-dw-backend.onrender.com/api
